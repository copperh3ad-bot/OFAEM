name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint + unit tests (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Cache Deno deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.json', 'supabase/functions/**/*.ts', 'tests/**/*.ts') }}

      - name: Lint
        run: deno lint supabase/functions/ tests/ scripts/

      - name: Unit tests
        run: deno test --allow-none tests/unit/

  migration-sanity:
    name: Migration files syntax sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Postgres
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Boot ephemeral Postgres in Docker
        run: |
          docker run -d --rm --name pg \
            -e POSTGRES_PASSWORD=ci \
            -p 5432:5432 \
            postgres:17
          # wait for ready
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 && break
            sleep 1
          done

      - name: Apply migrations in order
        env:
          PGPASSWORD: ci
        run: |
          # Bootstrap Supabase environment so migrations referencing auth.* /
          # the authenticated/service_role/anon roles can apply against a
          # vanilla Postgres container.
          psql -h localhost -U postgres -c "CREATE SCHEMA IF NOT EXISTS auth;"
          psql -h localhost -U postgres -c "CREATE TABLE IF NOT EXISTS auth.users (id UUID PRIMARY KEY DEFAULT gen_random_uuid());"
          psql -h localhost -U postgres -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          psql -h localhost -U postgres -c "CREATE OR REPLACE FUNCTION auth.uid() RETURNS UUID LANGUAGE SQL STABLE AS \$\$ SELECT NULL::uuid \$\$;"
          # Supabase built-in roles
          psql -h localhost -U postgres <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN BYPASSRLS;
            END IF;
          END $$;
          SQL
          # Run migrations
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Stop Postgres
        if: always()
        run: docker stop pg || true
